apiVersion: v1
kind: Service
metadata:
  name: nginx-multitool-svc
  labels:
    app: nginx-multitool
spec:
  selector:
    app: nginx-multitool
  ports:
  - name: nginx-http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: multitool-http
    port: 1180
    targetPort: 1180
    protocol: TCP
  - name: multitool-https
    port: 11443
    targetPort: 11443
    protocol: TCP
  type: ClusterIP