apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Kubernetes ConfigMap Demo</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f0f0f0;
                margin: 0;
                padding: 20px;
                text-align: center;
            }
            .container {
                background-color: white;
                border-radius: 10px;
                padding: 40px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                max-width: 600px;
                margin: 0 auto;
            }
            h1 {
                color: #326ce5;
                margin-bottom: 20px;
            }
            .info {
                background-color: #e8f5e9;
                border-left: 4px solid #4caf50;
                padding: 15px;
                margin: 20px 0;
                text-align: left;
            }
            .container-info {
                background-color: #f3e5f5;
                border-left: 4px solid #9c27b0;
                padding: 15px;
                margin: 20px 0;
                text-align: left;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🚀 Welcome to Kubernetes ConfigMap Demo</h1>
            <div class="info">
                <h3>✅ ConfigMap Loaded Successfully</h3>
                <p>This page is being served from a ConfigMap mounted as a volume.</p>
                <p><strong>Container:</strong> nginx</p>
            </div>
            <div class="container-info">
                <h3>🔧 Multi-Container Setup</h3>
                <p><strong>Container 1:</strong> nginx (web server)</p>
                <p><strong>Container 2:</strong> multitool (utility container)</p>
            </div>
            <p>Timestamp: <span id="timestamp"></span></p>
        </div>
        <script>
            document.getElementById('timestamp').textContent = new Date().toLocaleString();
        </script>
    </body>
    </html>